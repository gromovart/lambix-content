<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; }
body { width: 512px; height: 512px; background: #0A0A0A; display: flex; align-items: center; justify-content: center; }
.wrap {
  width: 512px;
  height: 512px;
  background: #0A0A0A;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  overflow: hidden;
}
.name {
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  font-size: 68px;
  font-weight: 800;
  color: #FFFFFF;
  letter-spacing: -1px;
  line-height: 1;
}
.line {
  width: 360px;
  height: 6px;
  background: #F59E0B;
  border-radius: 3px;
  margin: 14px 0 16px;
}
.sub {
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  font-size: 20px;
  font-weight: 500;
  color: #F59E0B;
  letter-spacing: 5px;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="name">LambixTrade</div>
  <div class="line"></div>
  <div class="sub">BYBIT · BINGX</div>
</div>
</body>
</html>
