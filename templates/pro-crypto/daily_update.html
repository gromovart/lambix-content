<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 600px;
  background: #0D0D0D;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  color: #FFFFFF;
  padding: 28px 28px 24px;
}

/* HEADER */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 22px;
}
.label {
  font-size: 11px; font-weight: 700;
  color: #F59E0B; letter-spacing: 3px;
}
.day-badge {
  background: #F59E0B;
  color: #0D0D0D;
  font-size: 11px; font-weight: 800;
  letter-spacing: 2px;
  padding: 6px 14px;
  border-radius: 6px;
}

/* TITLE */
.title {
  font-size: 38px; font-weight: 800;
  line-height: 1.08; letter-spacing: -0.5px;
  margin-bottom: 10px;
}
.title .accent { color: #F59E0B; }
.subtitle {
  font-size: 13px; font-weight: 600;
  color: #6B7280; letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 18px;
}

.divider {
  width: 100%; height: 1px;
  background: #2E2E2E;
  margin-bottom: 18px;
}

/* STATS ROW */
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.stat {
  background: #141414;
  border: 1px solid #1F1F1F;
  border-radius: 10px;
  padding: 14px 14px;
}
.stat-label {
  font-size: 10px; color: #6B7280;
  font-weight: 600; letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.stat-value {
  font-size: 20px; font-weight: 700; color: #FFFFFF;
}
.stat-value.green { color: #22c55e; }
.stat-value.red   { color: #ef4444; }
.stat-value.muted { color: #6B7280; font-weight: 600; font-size: 17px; }

/* MARKET BOX */
.market {
  background: #141414;
  border: 1px solid #1F1F1F;
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 16px;
}
.market-label {
  font-size: 10px; color: #6B7280;
  font-weight: 600; letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.market-text {
  font-size: 14px; line-height: 1.55; color: #D1D5DB;
}

/* FOOTER */
.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.disclaimer {
  font-size: 10px; color: #374151;
}
.channel {
  font-size: 12px; font-weight: 700;
  color: #F59E0B; letter-spacing: 0.5px;
}
</style>
</head>
<body>

<div class="header">
  <div class="label">PRO. Криптотрейдинг</div>
  <div class="day-badge">ДЕНЬ 2</div>
</div>

<div class="title">ДОБРОЕ<br><span class="accent">УТРО.</span></div>
<div class="subtitle">Начало торговой сессии</div>

<div class="divider"></div>

<div class="stats">
  <div class="stat">
    <div class="stat-label">Баланс</div>
    <div class="stat-value">$90</div>
  </div>
  <div class="stat">
    <div class="stat-label">От старта</div>
    <div class="stat-value green">+$8</div>
  </div>
  <div class="stat">
    <div class="stat-label">Позиции</div>
    <div class="stat-value muted">Нет</div>
  </div>
</div>

<div class="market">
  <div class="market-label">Рынок</div>
  <div class="market-text">BTC $66k · ETH $1 800 · Бычий, но осторожный — откат после роста. Трейдеры фиксируют, рынок выдыхает перед следующим движением.</div>
</div>

<div class="footer">
  <div class="disclaimer">Не финансовая рекомендация</div>
  <div class="channel">@pro_crypto_trading</div>
</div>

</body>
</html>
