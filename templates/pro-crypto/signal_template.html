<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 600px;
  background: #0D0D0D;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  color: #FFFFFF;
  overflow: hidden;
}

/* HEADER */
.header {
  padding: 24px 28px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.coin-info { display: flex; align-items: center; gap: 14px; }
.coin-icon {
  width: 48px; height: 48px; border-radius: 50%;
  background: #F59E0B;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800; color: #0D0D0D;
}
.coin-name { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
.coin-pair { font-size: 13px; color: #6B7280; margin-top: 2px; }
.direction {
  padding: 8px 20px;
  border-radius: 8px;
  font-size: 18px; font-weight: 800;
  letter-spacing: 2px;
}
.long  { background: #052e16; color: #22c55e; border: 1.5px solid #16a34a; }
.short { background: #2d0d0d; color: #ef4444; border: 1.5px solid #dc2626; }

/* CHART AREA */
.chart {
  margin: 0 28px;
  height: 160px;
  background: #141414;
  border-radius: 10px;
  position: relative;
  overflow: hidden;
}
.chart svg { width: 100%; height: 100%; }

/* SIGNAL BADGE */
.signal-badge {
  position: absolute;
  top: 10px; left: 12px;
  background: #F59E0B;
  color: #0D0D0D;
  font-size: 10px; font-weight: 800;
  letter-spacing: 2px;
  padding: 3px 10px;
  border-radius: 4px;
}

/* ENTRY LINE LABEL */
.entry-label {
  position: absolute;
  right: 10px; top: 50%;
  transform: translateY(-50%);
  font-size: 10px; color: #F59E0B; font-weight: 700;
  letter-spacing: 1px;
}

/* STATS */
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 16px 28px;
}
.stat {
  background: #141414;
  border-radius: 10px;
  padding: 14px 16px;
  border: 1px solid #1F1F1F;
}
.stat-label {
  font-size: 10px; color: #6B7280;
  font-weight: 600; letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.stat-value {
  font-size: 18px; font-weight: 700; color: #FFFFFF;
}
.stat-value.green { color: #22c55e; }
.stat-value.red   { color: #ef4444; }
.stat-value.orange { color: #F59E0B; }

/* TAKE PROFITS */
.tps {
  margin: 0 28px;
  background: #141414;
  border-radius: 10px;
  padding: 14px 16px;
  border: 1px solid #1F1F1F;
}
.tps-label {
  font-size: 10px; color: #6B7280;
  font-weight: 600; letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.tp-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid #1F1F1F;
}
.tp-row:last-child { border-bottom: none; }
.tp-num { font-size: 11px; color: #6B7280; font-weight: 600; width: 24px; }
.tp-price { font-size: 15px; font-weight: 700; color: #22c55e; }
.tp-rr { font-size: 11px; color: #6B7280; }

/* FOOTER */
.footer {
  padding: 14px 28px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.exchange {
  font-size: 11px; color: #6B7280;
  font-weight: 600; letter-spacing: 1px;
  text-transform: uppercase;
}
.channel {
  font-size: 11px; color: #F59E0B;
  font-weight: 700; letter-spacing: 1px;
}
.risk-note {
  font-size: 10px; color: #374151;
  padding: 0 28px 16px;
}
</style>
</head>
