<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 600px;
  background: #0D0D0D;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  color: #FFFFFF;
  padding: 28px 28px 24px;
}
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
.label { font-size: 11px; font-weight: 700; color: #F59E0B; letter-spacing: 3px; }
.day-info { text-align: right; }
.day-badge { background: #F59E0B; color: #0D0D0D; font-size: 10px; font-weight: 800; letter-spacing: 2px; padding: 5px 12px; border-radius: 6px; display: inline-block; margin-bottom: 4px; }
.day-name { font-size: 10px; color: #6B7280; letter-spacing: 1px; text-transform: uppercase; }
.rubric-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #141414;
  border: 1px solid #2E2E2E;
  border-radius: 6px;
  padding: 6px 14px;
  margin-bottom: 18px;
}
.rubric-dot { width: 7px; height: 7px; border-radius: 50%; background: #F59E0B; flex-shrink: 0; }
.rubric-name { font-size: 10px; font-weight: 700; color: #F59E0B; letter-spacing: 2.5px; text-transform: uppercase; }
.title { font-size: 34px; font-weight: 800; line-height: 1.08; letter-spacing: -0.5px; margin-bottom: 8px; }
.title .accent { color: #F59E0B; }
.week-theme { font-size: 11px; font-weight: 600; color: #6B7280; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 20px; }
.divider { width: 100%; height: 1px; background: #2E2E2E; margin-bottom: 18px; }
.excerpt {
  background: #141414;
  border: 1px solid #1F1F1F;
  border-radius: 10px;
  padding: 16px 18px;
  font-size: 14px;
  line-height: 1.6;
  color: #D1D5DB;
  margin-bottom: 16px;
}
.footer { display: flex; align-items: center; justify-content: space-between; }
.disclaimer { font-size: 10px; color: #374151; }
.channel { font-size: 12px; font-weight: 700; color: #F59E0B; letter-spacing: 0.5px; }
</style>
</head>
<body>

<div class="header">
  <div class="label">PRO. Криптотрейдинг</div>
  <div class="day-info">
    <div class="day-badge">ДЕНЬ {{DAY}}</div>
    <div class="day-name">{{DAY_OF_WEEK}}</div>
  </div>
</div>

<div class="rubric-tag">
  <div class="rubric-dot"></div>
  <div class="rubric-name">{{RUBRIC_NAME}}</div>
</div>

<div class="title">{{TITLE_LINE1}}<br><span class="accent">{{TITLE_LINE2}}</span></div>
<div class="week-theme">Неделя {{WEEK_NUM}} · {{WEEK_THEME}}</div>

<div class="divider"></div>

<div class="excerpt">{{EXCERPT}}</div>

<div class="footer">
  <div class="disclaimer">Не финансовая рекомендация</div>
  <div class="channel">@pro_crypto_trading</div>
</div>

</body>
</html>
