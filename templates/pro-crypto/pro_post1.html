<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 600px;
  background: #1A1A1A;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  padding: 40px 36px 44px;
  color: #FFFFFF;
}
.label {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}
.label-lines { display: flex; flex-direction: column; gap: 4px; }
.label-lines span { display: block; height: 3px; border-radius: 2px; background: #F59E0B; }
.label-lines span:first-child { width: 28px; }
.label-lines span:last-child  { width: 18px; }
.label-text {
  font-size: 11px; font-weight: 700;
  color: #F59E0B; letter-spacing: 3px; text-transform: uppercase;
}
.title {
  font-size: 48px; font-weight: 800;
  line-height: 1.05; color: #FFFFFF;
  margin-bottom: 20px; letter-spacing: -1px;
}
.title span { color: #F59E0B; }
.handle {
  font-size: 13px; font-weight: 600;
  color: #F59E0B; letter-spacing: 1px; text-transform: uppercase;
}
</style>
</head>
<body>
<div class="label">
  <div class="label-lines"><span></span><span></span></div>
  <div class="label-text">PRO. Криптотрейдинг</div>
</div>
<div class="title">СТАРТУЮ<br>С <span>НУЛЯ.</span><br>ПУБЛИЧНО.</div>
<div class="handle">@pro_crypto_trading</div>
</body>
</html>
